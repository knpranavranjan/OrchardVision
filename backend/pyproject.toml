[project]
name = "orchardvision-backend"
version = "0.2.0"
description = "OrchardVision backend: ground station, mission engine, flight records"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "pymavlink>=2.4.41",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "db: needs the PostgreSQL container from docker-compose.yml",
    "sitl: needs the ArduPilot SITL container on tcp:127.0.0.1:5760",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The checklist reads best as one check per line.
"app/flight/preflight.py" = ["E501"]
"tests/*" = ["E501"]
